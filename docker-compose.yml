services:
backend:
build: .
environment:
FLASK_HOST: 0.0.0.0
FLASK_PORT: 5000
FLASK_DEBUG: "0"
FABRIC_ENABLED: "0"
FABRIC_GATEWAY_URL: http://fabric-gateway:8080
ports:
- "5000:5000"
depends_on:
- fabric-gateway
# This service is an adapter between Flask and a real Hyperledger Fabric
# network. It is intentionally not a fake "fabric-peer on port 3000".
fabric-gateway:
build: ./fabric-gateway
ports:
- "8080:8080"
